<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>
	<style type="text/css">
		*{
			padding: 0px;
			margin: 0px;
			font-family: poppins;
			color: white;
			
		}
		.box1{
			background: lightgray;
			width: 100%;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.form_box{
			background: teal;
			padding: 20px;
			border-radius: 10px;
		}
		input{
			background: transparent;
			border: none;
			font-size: 25px;
			margin: 5px;
			width: 70px;
			height: 70px;
			border-radius: 12px;
			box-shadow: 0px 0px 10px black;
			cursor: pointer;
		}
		.display{
			display: flex;
			justify-content: flex-end;
			margin: 25px 0px;
		}
		.display input{
			font-size: 40px;
			text-align: right;
			box-shadow: none;
			flex: 1;
		}
		.clr{
			color: yellow;
		}
		#eql{
			width: 150px;
		}
	</style>
</head>
<body>
	<div class="box1">
		<form class="form_box">
			<div class="display">
				<input type="text" name="display">
			</div>
			<div>
				<input type="button" value="AC" onclick="display.value =''" class="clr">
				<input type="button" value="Del" onclick="display.value =display.value.toString().slice(0,-1)" 
				 class="clr">
				<input type="button" value="." onclick="display.value +='.'"  class="clr">
				<input type="button" value="/" onclick="display.value +='/'"  class="clr">
			</div>
			<div>
				<input type="button" value="7" onclick="display.value +='7'">
				<input type="button" value="8" onclick="display.value +='8'">

				<input type="button" value="9" onclick="display.value +='9'">
				<input type="button" value="*" onclick="display.value +='*'"  class="clr">
			</div>
			<div>
				<input type="button" value="4" onclick="display.value +='4'">
				<input type="button" value="5" onclick="display.value +='5'">
				<input type="button" value="6" onclick="display.value +='6'">
				<input type="button" value="-" onclick="display.value +='-'"  class="clr">
			</div>
			<div>
				<input type="button" value="1" onclick="display.value +='1'">
				<input type="button" value="2" onclick="display.value +='2'">
				<input type="button" value="3" onclick="display.value +='3'">
				<input type="button" value="+" onclick="display.value +='+'"  class="clr">
			</div>
			<div>
				<input type="button" value="00" onclick="display.value +='00'">
				<input type="button" value="0" onclick="display.value +='0'">
				<input type="button" value="=" onclick="display.value = eval(display.value)"  class="clr" id="eql">
			</div>
		</form>		
	</div>
</body>
</html>
