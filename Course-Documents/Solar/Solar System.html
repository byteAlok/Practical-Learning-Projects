<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            font-family: arial;
        }
        body{
            background: url("web image/universe.jpg");
        }
        #earth{
            width: 900px;
            height: 900px;
            background-color: yellow;
            border: 1px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            position: absolute;
            transform: translate(-50%,-50%);
            animation: erth 2s linear infinite;
            text-align: center;
            box-shadow: 0px 0px 15px black inset,
                        0px 0px 25px yellow;
        }
        
        #orbit{
          width: 2000px;
          height: 2000px;
          border-color: white;
          border-style: solid;
          border-width: 1px;
          top: 50%;
          left: 50%;
          position: absolute;
          transform: translate(-50%,-50%);
          border-radius: 50%;
          animation: rotate1 7s infinite linear;
        }
        @keyframes rotate1{
            100%{
                transform: translate(-50%,-50%)rotate(360deg);
            }
        }
        #moon{
            width: 450px;
            height: 450px;
            background-color: deepskyblue;
            border-radius: 50%;
            top: 20%;
            left: 10%;
            position: absolute;
            transform: translate(-50%,-50%);
        }
        #cv{
            width: 750px;
            height: 750px;
            border:1px solid white;
            border-radius: 50%;
            position: absolute;
            background-position: center;
            transform: translate(-20%,-20%);
            animation: rotate3 5s infinite linear;
        }
        @keyframes rotate3 {
            100%{
                transform: translate(-20%,-20%)rotate(360deg);
            }
        }

        #vv{
            width: 150px;
            height: 150px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            transform: translate(20%,20%);
        }
        h2{
            text-align: center;
            font-size: 150px;
            padding-top: 360px;
            
        }

    </style>
</head>
<body>
    <div id="earth"><img src="web image/sun.png" style="width:1200px; height: auto;"> <h2>Sun</h2> </div>
    <div id="orbit">
        <div id="moon">
            <div id="cv"> <div id="vv"></div>
            </div>
        </div>
    </div>



</body>
</html>
