<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>
<script type="text/javascript">
   (function(){
      emailjs.init({
        publicKey: "6HzzkqDwohZ8Oo0nd",
      });
   })();
</script>

</head>
<body>

    <input type="text" placeholder="Enter Your Name" id="txt1"/>
    <input type="text" placeholder="Enter Your Message" id="txt2"/>
    <button onclick="send()">Send Message</button>

    <script>
        function send()
        {
            var parm = {
                name:document.getElementById("txt1").value,
                message:document.getElementById("txt2").value
            }
            emailjs.send("service_khm1hw6", "template_ij1qbqs", parm)
            .then(alert("Email Sent"))
        }
    </script>
    
</body>
</html>
