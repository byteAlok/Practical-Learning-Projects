<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="/jquery-3.7.1.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .box {
            width: 356px;
            height: 550px;
            background-color: rgb(27, 74, 73);
            border-radius: 10px;
            overflow: hidden;
            margin: auto;
            padding: 24px;

        }

        #data {
            background-color: aliceblue;
            width: 100%;
            height: 90px;
            margin: 10px auto;
            border-radius: 10px;
            font-size: 28px;
            text-align: right;
        }

        .btns {
            margin: 16px 0px 10px 0px;
        }

        button {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 15%;
            font-size: 28px;
            margin: 8px;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="box">
            <input type="text" id="data" readonly/>
            <div class="btns">

                <button id="allClr">AC</button>
                <button id="clr">C</button>
                <button class="btn" value="%">%</button>
                <button class="btn" value="/">/</button>
                <br />
                <button class="btn" value="7">7</button>
                <button class="btn" value="8">8</button>
                <button class="btn" value="9">9</button>
                <button class="btn" value="x">x</button>
                <br />
                <button class="btn" value="4">4</button>
                <button class="btn" value="5">5</button>
                <button class="btn" value="6">6</button>
                <button class="btn" value="-">-</button>
                <br />
                <button class="btn" value="1">1</button>
                <button class="btn" value="2">2</button>
                <button class="btn" value="3">3</button>
                <button class="btn" value="+">+</button>
                <br />
                <button class="btn" value="00">00</button>
                <button class="btn" value="0">0</button>
                <button class="btn" value=".">.</button>
                <button id="eql">=</button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){

            var display = $("#data")

            $(".btn").click(function(){
                display.val(display.val() + $(this).val())
            })

            $("#eql").click(function(){
                display.val(eval(display.val()))
            })

            $("#clr").click(function(){
                display.val(display.val().slice(0,-1))
            })

            $("#allClr").click(function(){
                display.val("")
            })

        })
  
    </script>





</body>

</html>
